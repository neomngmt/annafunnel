<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a181e">
<meta name="robots" content="noindex">
<title>Chat</title>
<style>
  :root {
    --bg: #0e0d10; --surface: #1a181e; --bubble: #26232c; --accent: #e8467c;
    --text: #f5f3f7; --muted: #a29eab; --line: #2c2932;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  html { background: var(--bg); }
  * { -webkit-tap-highlight-color: transparent; }
  button, a { touch-action: manipulation; }
  body { background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; }
  /* Pinned to the visible area, which script.fit() shrinks when the keyboard opens. */
  .app { position: fixed; top: 0; left: 0; right: 0; height: var(--app-height, 100dvh); max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }
  [hidden] { display: none !important; }

  .gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  .gate p { margin: 0; color: var(--muted); }
  .gate p:empty { display: none; }
  .gate > * { animation: rise .55s cubic-bezier(.2, 1.3, .4, 1) both; }
  .gate > :nth-child(2) { animation-delay: .1s; }
  .gate > :nth-child(3) { animation-delay: .15s; }
  .gate > :nth-child(4) { animation-delay: .2s; }
  .gate > :nth-child(5) { animation-delay: .3s; }
  .gate-ring { position: relative; padding: 5px; border-radius: 50%; }
  .gate-ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#ff5f9e, #ffb14c, #b14cff, #ff5f9e); animation: spin 3s linear infinite; }
  .gate-ring .gate-avatar { position: relative; width: 180px; height: 180px; font-size: 64px; border: 4px solid var(--bg); background: var(--surface); }
  .gate-name { font-size: 24px; }
  .gate .gate-note { font-size: 13px; }
  .primary { position: relative; overflow: hidden; width: 100%; max-width: 320px; padding: 14px; border: 0; border-radius: 12px; background: linear-gradient(120deg, #ff5f9e, var(--accent) 50%, #b14cff); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; display: block; text-align: center; transition: transform .12s; }
  .primary:active { transform: scale(.96); }
  .primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent); transform: skewX(-20deg); animation: shine 2.6s ease-in-out infinite; }
  #gateYes { animation: rise .55s .2s cubic-bezier(.2, 1.3, .4, 1) both, glow 1.8s .8s ease-in-out infinite; }
  #chat:not([hidden]) { animation: chatIn .3s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.94); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 70, 124, .55); } 50% { box-shadow: 0 0 22px 4px rgba(232, 70, 124, .55); } }
  @keyframes chatIn { from { opacity: 0; transform: translateY(12px); } }

  .head { flex: none; display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; background: var(--accent); display: grid; place-items: center; font-weight: 700; }
  .avatar-wrap { position: relative; flex: none; width: 44px; height: 44px; }
  .online { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: #22c55e; border: 2px solid var(--surface); }
  .online::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; background: #22c55e; animation: online 1.8s ease-out infinite; }
  @keyframes online { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.4); } }
  @media (prefers-reduced-motion: reduce) { .online::after { animation: none; opacity: 0; } }
  .who { min-width: 0; }
  .name { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .ai-badge { padding: 0 4px; border-radius: 4px; border: 1px solid var(--muted); color: var(--muted); font-size: 11px; font-weight: 500; line-height: 1.4; }

  .log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .log > * { flex: none; }
  .msg { max-width: 80%; padding: 9px 13px; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; animation: pop .32s cubic-bezier(.2, 1.5, .4, 1) both; }
  .msg.assistant { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; transform-origin: 0 100%; }
  .msg.user { align-self: flex-end; background: linear-gradient(120deg, #ff5f9e, var(--accent)); color: #fff; border-bottom-right-radius: 4px; transform-origin: 100% 100%; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.82); } }
  .msg.typing { display: flex; gap: 5px; padding: 14px 13px; }
  .msg.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: typing 1.2s infinite; }
  .msg.typing i:nth-child(2) { animation-delay: .2s; }
  .msg.typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes typing { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .msg.typing i { animation: none; } }
  .tease { align-self: flex-start; display: block; width: 70%; max-width: 280px; max-height: 60vh; object-fit: cover; border-radius: 16px; border-bottom-left-radius: 4px; transform-origin: 0 100%; animation: photoIn 1.1s cubic-bezier(.2, .9, .3, 1) both; }
  @keyframes photoIn { 0% { opacity: 0; filter: blur(24px) brightness(1.4); transform: scale(.86); } 45% { opacity: 1; } 100% { filter: none; transform: none; } }
  .link-card { align-self: stretch; padding: 8px 0; }
  .link-card .primary { max-width: none; padding: 16px; font-size: 17px; animation: ctaIn .6s cubic-bezier(.2, 1.6, .4, 1) both, glow 1.5s .6s ease-in-out infinite; }
  @keyframes ctaIn { from { opacity: 0; transform: translateY(16px) scale(.8); } }
  .burst { position: absolute; bottom: 60px; left: var(--x); font-size: var(--size); pointer-events: none; animation: float var(--time) ease-out var(--wait) both; }
  @keyframes float { 0% { opacity: 0; transform: translateY(0) scale(.5); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--drift), -55vh) scale(1.15) rotate(var(--turn)); } }
  .notice { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }

  form { flex: none; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
  form input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; }
  form input { transition: border-color .15s; }
  form input:focus { outline: none; border-color: var(--accent); }
  form button { padding: 0 16px; border: 0; border-radius: 20px; background: linear-gradient(120deg, #ff5f9e, var(--accent)); color: #fff; font-weight: 600; cursor: pointer; transition: transform .12s; }
  form button:active { transform: scale(.9); }
  form button:disabled { opacity: .5; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    .gate > *, .gate-ring::before, .primary::after, #gateYes, #chat:not([hidden]), .msg, .tease, .link-card .primary { animation: none; }
    .burst { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="gate" id="gate">
    <div class="gate-ring"><div class="avatar gate-avatar" id="gateAvatar"></div></div>
    <div class="name gate-name"><span id="gateName"></span></div>
    <p id="gateText"></p>
    <button class="primary" id="gateYes"></button>
    <p class="gate-note" id="gateNote"></p>
  </section>

  <section id="chat" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header class="head">
      <div class="avatar-wrap">
        <div class="avatar" id="avatar"></div>
        <span class="online"></span>
      </div>
      <div class="who">
        <div class="name"><span id="name"></span></div>
      </div>
    </header>
    <div class="log" id="log" aria-live="polite"></div>
    <form id="form">
      <input id="input" maxlength="400" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" aria-label="Message">
      <button id="send" type="submit"></button>
    </form>
  </section>
</div>

<script>
const params = new URLSearchParams(location.search);
const slug = "ukazka";
const source = "direct";

const TEXT = {
  cs: {
    gateYes: "Začít chat", gateNote: "Pokračováním potvrzuješ, že je ti 18+.",
    send: "Poslat", placeholder: "Napiš zprávu", open: "Otevřít OnlyFans",
    ended: "Chat skončil", error: "Něco se pokazilo, zkus to za chvilku.", tooMany: "Teď je tu moc lidí, zkus to později.", missing: "Tahle stránka neexistuje.",
  },
  en: {
    gateYes: "Start chat", gateNote: "By continuing you confirm you are 18+.",
    send: "Send", placeholder: "Write a message", open: "Open OnlyFans",
    ended: "Chat ended", error: "Something went wrong, try again in a moment.", tooMany: "It's busy right now, try again later.", missing: "This page doesn't exist.",
  },
};
let t = params.get("lang") === "en" ? TEXT.en : TEXT.cs;
const $ = (id) => document.getElementById(id);

$("gateYes").textContent = t.gateYes;
$("gateNote").textContent = t.gateNote;

// Keep the app inside the part of the screen the keyboard leaves free, with the newest message in view.
let fittedHeight = 0;
function fit() {
  const view = window.visualViewport;
  const app = document.querySelector(".app");
  const height = view ? view.height : window.innerHeight;
  document.documentElement.style.setProperty("--app-height", `${height}px`);
  app.style.transform = view && view.offsetTop ? `translateY(${view.offsetTop}px)` : "";
  window.scrollTo(0, 0);
  // Only when the size changed, so scrolling back through the chat is left alone.
  if (height !== fittedHeight) $("log").scrollTop = $("log").scrollHeight;
  fittedHeight = height;
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fit);
  window.visualViewport.addEventListener("scroll", fit);
}
window.addEventListener("orientationchange", fit);
fit();

// Tapping Send must not take focus from the input, or the keyboard closes after every message.
$("send").addEventListener("mousedown", (e) => e.preventDefault());
$("send").addEventListener("touchend", (e) => {
  e.preventDefault();
  $("form").requestSubmit();
});

let sessionId = null;
const history = [];

// Sketch only: scripted replies instead of the server, so nothing leaves this page.
const PLACEHOLDER_PHOTO = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f9e"/><stop offset="1" stop-color="#b14cff"/></linearGradient></defs><rect width="560" height="700" fill="url(#g)"/><text x="280" y="360" fill="#fff" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle">SEM PŘIJDE FOTKA</text></svg>'
);
const SCRIPT = [
  { reply: "hmm tak to jsem ráda že jsi napsal 😏 co teď děláš?" },
  { reply: "to zní dobře.. já jsem doma sama a nudím se 🙈" },
  { photo: PLACEHOLDER_PHOTO, reply: "tak tady máš něco malýho ať víš s kým si píšeš 😘" },
  { reply: "víc už ti ukážu jen tam 😈", followUp: "píšu si hlavně na OF, tak se stav", link: "#", ended: true },
];
let step = 0;

async function api(body) {
  await new Promise((r) => setTimeout(r, 900));
  if (body.action === "start") return { sessionId: "nacrt", ...PAGES.ukazka, opener: "Čaukyy odkud jsi mě našel?" };
  return SCRIPT[Math.min(step++, SCRIPT.length - 1)];
}

function buzz(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function add(role, text) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.textContent = text;
  $("log").append(el);
  $("log").scrollTop = $("log").scrollHeight;
  if (role === "assistant" && text) buzz(12);
  return el;
}

function burst() {
  const app = document.querySelector(".app");
  for (let i = 0; i < 14; i++) {
    const el = document.createElement("span");
    el.className = "burst";
    el.textContent = ["❤️", "💋", "🔥", "😈"][i % 4];
    el.style.setProperty("--x", `${5 + Math.random() * 85}%`);
    el.style.setProperty("--size", `${18 + Math.random() * 16}px`);
    el.style.setProperty("--time", `${1.2 + Math.random() * 0.9}s`);
    el.style.setProperty("--wait", `${Math.random() * 0.45}s`);
    el.style.setProperty("--drift", `${-40 + Math.random() * 80}px`);
    el.style.setProperty("--turn", `${-30 + Math.random() * 60}deg`);
    el.addEventListener("animationend", () => el.remove());
    app.append(el);
  }
}

function addTyping() {
  const el = add("assistant", "");
  el.classList.add("typing");
  el.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function addPhoto(url) {
  const img = document.createElement("img");
  img.className = "tease";
  img.alt = "";
  img.src = url;
  img.addEventListener("load", () => { $("log").scrollTop = $("log").scrollHeight; });
  $("log").append(img);
  buzz([20, 40, 20]);
}

// Messages that arrive together are shown one at a time.
async function afterTyping(text) {
  const typing = addTyping();
  await new Promise((r) => setTimeout(r, 1300));
  typing.remove();
  add("assistant", text);
}

function notice(text) {
  const el = document.createElement("div");
  el.className = "notice";
  el.textContent = text;
  $("log").append(el);
  $("log").scrollTop = $("log").scrollHeight;
}

function addLink(url) {
  const wrap = document.createElement("div");
  wrap.className = "link-card";
  const a = document.createElement("a");
  a.className = "primary";
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = t.open;
  a.addEventListener("click", (e) => {
    e.preventDefault();
    notice("Tady se otevře odkaz modelky.");
  });
  wrap.append(a);
  $("log").append(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  buzz([30, 50, 30]);
  burst();
}

function endChat() {
  $("form").hidden = true;
  notice(t.ended);
}

// Known pages draw their start screen straight away. Any other slug asks the server,
// which is slower. No session opens until the button is pressed.
const PAGES = {
  ukazka: { name: "Anna", language: "cs", photoUrl: "https://eschqmjjmnqllejbcpab.supabase.co/storage/v1/object/public/funnel/anna/anna-avatar.jpg" },
};

let shown = null;

function showStart(p) {
  shown = p;
  t = TEXT[p.language] || t;
  document.documentElement.lang = p.language;
  document.title = p.name;
  $("gateName").textContent = p.name;
  $("gateYes").textContent = t.gateYes;
  $("gateNote").textContent = t.gateNote;
  if (/^https:\/\//.test(p.photoUrl || "")) {
    const img = document.createElement("img");
    img.className = "avatar gate-avatar";
    img.alt = "";
    img.fetchPriority = "high";
    img.src = p.photoUrl;
    $("gateAvatar").replaceWith(img);
  } else {
    $("gateAvatar").textContent = p.name.charAt(0);
  }
}

if (Object.hasOwn(PAGES, slug)) {
  showStart(PAGES[slug]);
} else {
  api({ action: "page", slug }).then(showStart).catch((e) => {
    $("gateText").textContent = e.status === 404 ? t.missing : t.error;
    if (e.status === 404) $("gateYes").hidden = true;
  });
}

function fillChat(p) {
  t = TEXT[p.language] || t;
  document.documentElement.lang = p.language;
  document.title = p.name;
  $("name").textContent = p.name;
  $("send").textContent = t.send;
  $("input").placeholder = t.placeholder;
  if (/^https:\/\//.test(p.photoUrl || "")) {
    const img = document.createElement("img");
    img.className = "avatar";
    img.alt = "";
    img.src = p.photoUrl;
    $("avatar").replaceWith(img);
  } else {
    $("avatar").textContent = p.name.charAt(0);
  }
}

// The chat opens on the tap itself. The session starts behind the typing dots,
// so a slow server only makes her "type" a little longer.
$("gateYes").addEventListener("click", async () => {
  const opened = Date.now();
  $("gateText").textContent = "";
  $("gate").hidden = true;
  $("chat").hidden = false;
  $("send").disabled = true;
  if (shown && !$("name").textContent) fillChat(shown);
  $("input").focus();
  const typing = addTyping();
  try {
    const s = await api({ action: "start", slug, source, ageConfirmed: true });
    sessionId = s.sessionId;
    if (!$("name").textContent) fillChat(s);
    await new Promise((r) => setTimeout(r, Math.max(0, 1200 - (Date.now() - opened))));
    typing.remove();
    add("assistant", s.opener);
    $("send").disabled = false;
  } catch (e) {
    typing.remove();
    $("chat").hidden = true;
    $("gate").hidden = false;
    $("gateText").textContent = e.status === 404 ? t.missing : e.status === 429 ? t.tooMany : t.error;
  }
});

// Messages sent in a row wait for a short pause and get one answer together.
const pending = [];
let pauseTimer = null;
let busy = false;

$("form").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("input").value.trim();
  if (!text || $("send").disabled) return;
  $("input").value = "";
  add("user", text);
  const typing = document.querySelector(".msg.typing");
  if (typing) $("log").append(typing);
  pending.push(text);
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(answer, 1500);
  $("input").focus();
});

async function answer() {
  if (busy || !pending.length) return;
  busy = true;
  const text = pending.splice(0).join("\n").slice(-400);
  const typing = addTyping();
  try {
    const r = await api({ action: "message", sessionId, text, history });
    typing.remove();
    if (/^data:image\//.test(r.photo || "")) {
      addPhoto(r.photo);
      await afterTyping(r.reply);
    } else {
      add("assistant", r.reply);
    }
    if (r.followUp) await afterTyping(r.followUp);
    history.push({ role: "user", content: text }, { role: "assistant", content: r.followUp ? `${r.reply}\n${r.followUp}` : r.reply });
    if (r.link) addLink(r.link);
    if (r.ended) {
      pending.length = 0;
      // With the link out, the button is the last thing on screen.
      $("input").blur();
      if (r.link) $("form").hidden = true;
      else endChat();
      fit();
    }
  } catch (e) {
    typing.remove();
    notice(t.error);
  }
  busy = false;
  if (pending.length) pauseTimer = setTimeout(answer, 1500);
}
</script>
</body>
</html>
