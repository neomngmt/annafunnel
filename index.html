<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a181e">
<meta name="robots" content="noindex">
<!-- The funnel-chat function URL. The local dev server swaps in its own /api. -->
<meta name="funnel-api" content="https://eschqmjjmnqllejbcpab.supabase.co/functions/v1/funnel-chat">
<title>Chat</title>
<style>
  :root {
    --bg: #0e0d10; --surface: #1a181e; --bubble: #26232c; --accent: #e8467c;
    --text: #f5f3f7; --muted: #a29eab; --line: #2c2932;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  html { background: var(--bg); }
  * { -webkit-tap-highlight-color: transparent; }
  button, a { touch-action: manipulation; }
  body { background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; }
  /* Pinned to the visible area, which script.fit() shrinks when the keyboard opens. */
  .app { position: fixed; top: 0; left: 0; right: 0; height: var(--app-height, 100dvh); max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }

  .gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  .gate p { margin: 0; color: var(--muted); }
  .gate-avatar { width: 112px; height: 112px; font-size: 40px; }
  .gate-name { font-size: 20px; }
  .primary { width: 100%; max-width: 320px; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; display: block; text-align: center; }

  .head { flex: none; display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; background: var(--accent); display: grid; place-items: center; font-weight: 700; }
  .avatar-wrap { position: relative; flex: none; width: 44px; height: 44px; }
  .online { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: #22c55e; border: 2px solid var(--surface); }
  .online::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; background: #22c55e; animation: online 1.8s ease-out infinite; }
  @keyframes online { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.4); } }
  @media (prefers-reduced-motion: reduce) { .online::after { animation: none; opacity: 0; } }
  .who { min-width: 0; }
  .name { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .ai-badge { padding: 1px 6px; border-radius: 5px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 700; line-height: 1.4; }

  .log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .log > * { flex: none; }
  .msg { max-width: 80%; padding: 9px 13px; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.typing { display: flex; gap: 5px; padding: 14px 13px; }
  .msg.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: typing 1.2s infinite; }
  .msg.typing i:nth-child(2) { animation-delay: .2s; }
  .msg.typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes typing { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .msg.typing i { animation: none; } }
  .tease { align-self: flex-start; display: block; width: 70%; max-width: 280px; max-height: 60vh; object-fit: cover; border-radius: 16px; border-bottom-left-radius: 4px; }
  .link-card { align-self: stretch; padding: 8px 0; }
  .link-card .primary { max-width: none; }
  .notice { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }

  form { flex: none; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
  form input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; }
  form button { padding: 0 16px; border: 0; border-radius: 20px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <section class="gate" id="gate">
    <div class="avatar gate-avatar" id="gateAvatar"></div>
    <div class="name gate-name"><span id="gateName"></span></div>
    <p id="gateText"></p>
    <button class="primary" id="gateYes"></button>
  </section>

  <section id="chat" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header class="head">
      <div class="avatar-wrap">
        <div class="avatar" id="avatar"></div>
        <span class="online"></span>
      </div>
      <div class="who">
        <div class="name"><span id="name"></span><span class="ai-badge">AI</span></div>
      </div>
    </header>
    <div class="log" id="log" aria-live="polite"></div>
    <form id="form">
      <input id="input" maxlength="400" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" aria-label="Message">
      <button id="send" type="submit"></button>
    </form>
  </section>
</div>

<script>
const API = document.querySelector('meta[name="funnel-api"]').content;
const params = new URLSearchParams(location.search);
const slug = params.get("m") || "";
const source = params.get("src") || "direct";

const TEXT = {
  cs: {
    gateYes: "Začít chat (18+)",
    send: "Poslat", placeholder: "Napiš zprávu", open: "Otevřít OnlyFans",
    ended: "Chat skončil", error: "Něco se pokazilo, zkus to za chvilku.", tooMany: "Teď je tu moc lidí, zkus to později.", missing: "Tahle stránka neexistuje.",
  },
  en: {
    gateYes: "Start chat (18+)",
    send: "Send", placeholder: "Write a message", open: "Open OnlyFans",
    ended: "Chat ended", error: "Something went wrong, try again in a moment.", tooMany: "It's busy right now, try again later.", missing: "This page doesn't exist.",
  },
};
let t = params.get("lang") === "en" ? TEXT.en : TEXT.cs;
const $ = (id) => document.getElementById(id);

$("gateYes").textContent = t.gateYes;

// Keep the app inside the part of the screen the keyboard leaves free, with the newest message in view.
function fit() {
  const view = window.visualViewport;
  const app = document.querySelector(".app");
  document.documentElement.style.setProperty("--app-height", `${view ? view.height : window.innerHeight}px`);
  app.style.transform = view && view.offsetTop ? `translateY(${view.offsetTop}px)` : "";
  window.scrollTo(0, 0);
  $("log").scrollTop = $("log").scrollHeight;
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fit);
  window.visualViewport.addEventListener("scroll", fit);
}
window.addEventListener("orientationchange", fit);
fit();

// Tapping Send must not take focus from the input, or the keyboard closes after every message.
$("send").addEventListener("mousedown", (e) => e.preventDefault());
$("send").addEventListener("touchend", (e) => {
  e.preventDefault();
  $("form").requestSubmit();
});

let sessionId = null;
const history = [];

async function api(body) {
  const resp = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await resp.json().catch(() => ({}));
  if (!resp.ok) throw Object.assign(new Error(json.error || "Request failed"), { status: resp.status });
  return json;
}

function add(role, text) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.textContent = text;
  $("log").append(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function addTyping() {
  const el = add("assistant", "");
  el.classList.add("typing");
  el.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function addPhoto(url) {
  const img = document.createElement("img");
  img.className = "tease";
  img.alt = "";
  img.src = url;
  img.addEventListener("load", () => { $("log").scrollTop = $("log").scrollHeight; });
  $("log").append(img);
}

// Messages that arrive together are shown one at a time.
async function afterTyping(text) {
  const typing = addTyping();
  await new Promise((r) => setTimeout(r, 1300));
  typing.remove();
  add("assistant", text);
}

function notice(text) {
  const el = document.createElement("div");
  el.className = "notice";
  el.textContent = text;
  $("log").append(el);
  $("log").scrollTop = $("log").scrollHeight;
}

function addLink(url) {
  const wrap = document.createElement("div");
  wrap.className = "link-card";
  const a = document.createElement("a");
  a.className = "primary";
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = t.open;
  a.addEventListener("click", () => {
    fetch(API, { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "click", sessionId }) }).catch(() => {});
  });
  wrap.append(a);
  $("log").append(wrap);
  $("log").scrollTop = $("log").scrollHeight;
}

function endChat() {
  $("form").hidden = true;
  notice(t.ended);
}

// Fill the start screen with her name and photo. No session opens until the button is pressed.
api({ action: "page", slug }).then((p) => {
  t = TEXT[p.language] || t;
  document.documentElement.lang = p.language;
  document.title = p.name;
  $("gateName").textContent = p.name;
  $("gateYes").textContent = t.gateYes;
  if (/^https:\/\//.test(p.photoUrl || "")) {
    const img = document.createElement("img");
    img.className = "avatar gate-avatar";
    img.alt = "";
    img.src = p.photoUrl;
    $("gateAvatar").replaceWith(img);
  } else {
    $("gateAvatar").textContent = p.name.charAt(0);
  }
}).catch((e) => {
  $("gateText").textContent = e.status === 404 ? t.missing : t.error;
  if (e.status === 404) $("gateYes").hidden = true;
});

$("gateYes").addEventListener("click", async () => {
  $("gateYes").disabled = true;
  try {
    const s = await api({ action: "start", slug, source, ageConfirmed: true });
    sessionId = s.sessionId;
    t = TEXT[s.language] || t;
    document.documentElement.lang = s.language;
    document.title = s.name;
    $("name").textContent = s.name;
    $("send").textContent = t.send;
    $("input").placeholder = t.placeholder;
    if (/^(https:\/\/|\/models\/)/.test(s.photoUrl || "")) {
      const img = document.createElement("img");
      img.className = "avatar";
      img.alt = "";
      img.src = s.photoUrl;
      $("avatar").replaceWith(img);
    } else {
      $("avatar").textContent = s.name.charAt(0);
    }
    $("gate").hidden = true;
    $("chat").hidden = false;
    $("send").disabled = true;
    $("input").focus();
    const typing = addTyping();
    await new Promise((r) => setTimeout(r, 1600));
    typing.remove();
    add("assistant", s.opener);
    $("send").disabled = false;
  } catch (e) {
    $("gateYes").disabled = false;
    $("gateText").textContent = e.status === 404 ? t.missing : e.status === 429 ? t.tooMany : t.error;
  }
});

// Messages sent in a row wait for a short pause and get one answer together.
const pending = [];
let pauseTimer = null;
let busy = false;

$("form").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("input").value.trim();
  if (!text || $("send").disabled) return;
  $("input").value = "";
  add("user", text);
  const typing = document.querySelector(".msg.typing");
  if (typing) $("log").append(typing);
  pending.push(text);
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(answer, 1500);
  $("input").focus();
});

async function answer() {
  if (busy || !pending.length) return;
  busy = true;
  const text = pending.splice(0).join("\n").slice(-400);
  const typing = addTyping();
  try {
    const r = await api({ action: "message", sessionId, text, history });
    typing.remove();
    if (/^(https:\/\/|\/models\/)/.test(r.photo || "")) {
      addPhoto(r.photo);
      await afterTyping(r.reply);
    } else {
      add("assistant", r.reply);
    }
    if (r.followUp) await afterTyping(r.followUp);
    history.push({ role: "user", content: text }, { role: "assistant", content: r.followUp ? `${r.reply}\n${r.followUp}` : r.reply });
    if (r.link) addLink(r.link);
    if (r.ended) {
      pending.length = 0;
      // With the link out, the button is the last thing on screen.
      $("input").blur();
      if (r.link) $("form").hidden = true;
      else endChat();
      fit();
    }
  } catch (e) {
    typing.remove();
    notice(t.error);
  }
  busy = false;
  if (pending.length) pauseTimer = setTimeout(answer, 1500);
}
</script>
</body>
</html>
